name: collect

on:
  schedule:
    - cron: "17 */6 * * *" # каждые 6 часов
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — по ситуации, quick — свежие видео, full — полный пересчёт"
        type: choice
        options: [auto, quick, full]
        default: auto

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сбор через Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: node scripts/collect.mjs
      - name: Сохранить данные
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
